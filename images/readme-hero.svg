<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
  <title id="title">RVTools Analyzer</title>
  <desc id="description">RVTools Analyzer queries VMware inventory, calculates overcommit, assesses OCVS and HCX migration risk, reviews VCF readiness, checks vSphere health, and creates reports.</desc>
  <defs>
    <clipPath id="rounded-panel">
      <rect width="1200" height="690" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded-panel)">
    <rect width="1200" height="300" fill="#c74634"/>
    <rect y="300" width="1200" height="390" fill="#312d2a"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="72" y="74" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="3">VMWARE INVENTORY · MIGRATION · HEALTH</text>
    <text x="72" y="174" fill="#ffffff" font-size="70" font-weight="650" letter-spacing="-2">RVTools Analyzer</text>
    <text x="74" y="228" fill="#fff4f1" font-size="24">Ask questions in plain language. Turn the same export into</text>
    <text x="74" y="262" fill="#fff4f1" font-size="24">migration, readiness, and health-check reports.</text>

    <text x="72" y="364" fill="#f4b9ae" font-size="16" font-weight="700" letter-spacing="3">WHAT IT CAN DO</text>

    <g fill="#ffffff" font-size="20">
      <circle cx="82" cy="412" r="5" fill="#c74634"/>
      <text x="104" y="417">Answer VM, OS, and power-state questions</text>
      <text x="104" y="443">across hosts and clusters</text>

      <circle cx="82" cy="489" r="5" fill="#c74634"/>
      <text x="104" y="494">Calculate CPU and memory</text>
      <text x="104" y="520">overcommit ratios</text>

      <circle cx="82" cy="566" r="5" fill="#c74634"/>
      <text x="104" y="571">Assess OCVS and VMware HCX</text>
      <text x="104" y="597">migration risks</text>

      <circle cx="626" cy="412" r="5" fill="#c74634"/>
      <text x="648" y="417">Review VMware Cloud Foundation</text>
      <text x="648" y="443">readiness</text>

      <circle cx="626" cy="489" r="5" fill="#c74634"/>
      <text x="648" y="494">Check vSphere health and</text>
      <text x="648" y="520">hardware lifecycle</text>

      <circle cx="626" cy="566" r="5" fill="#c74634"/>
      <text x="648" y="571">Create self-contained HTML</text>
      <text x="648" y="597">and Markdown reports</text>
    </g>

    <line x1="72" y1="624" x2="1128" y2="624" stroke="#625d59" stroke-width="1"/>
    <text x="72" y="656" fill="#bcb5b0" font-size="16">Deterministic local analysis · Conversational follow-ups · Evidence-based interpretation</text>
  </g>
</svg>
